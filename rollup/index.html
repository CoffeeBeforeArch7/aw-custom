<!doctype html>
<meta charset="utf-8" />
<title>Time by Category</title>
<style>
  :root {
    --text: #1f2329;
    --muted: #828b99;
    --border: #e6e8ec;
  }
  @media (prefers-color-scheme: dark) {
    :root { --text: #e9ebf0; --muted: #8a93a3; --border: #262c36; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: transparent; color: var(--text);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #ctl { margin-bottom: 0.4rem; color: var(--muted); font-size: 0.8em; }
  #ctl select { font: inherit; color: var(--text); background: transparent; border: 1px solid var(--border); border-radius: 4px; padding: 0 0.2rem; }

  #info { height: 3.4em; }
  #info .crumb { font-size: 0.75em; color: var(--muted); }
  #info .name { font-size: 1.1em; font-weight: 600; }
  #info .val { font-size: 0.82em; color: var(--muted); }

  #root { display: block; width: 100%; }
  #chart { display: flex; justify-content: center; }
  /* 老界面里 custom_vis 的 iframe 是死的 300x150，给个 max-height 让图自己缩下去而不是被裁 */
  svg { display: block; width: 100%; max-width: 460px; height: auto; }

  svg path { cursor: pointer; transition: opacity 0.12s; }
  svg path.dim { opacity: 0.2; }
  svg text { pointer-events: none; user-select: none; }
  #back { cursor: pointer; }

  #err { color: #c00; font-size: 0.85em; white-space: pre-wrap; }

  /* 塞进很矮的框里（老界面的 custom_vis iframe 是死的 300x150）时，只留图 */
  @media (max-height: 340px) {
    #ctl, #info { display: none; }
  }
</style>

<div id="root">
<div id="ctl">
  小于
  <select id="min">
    <option value="900">15m</option>
    <option value="1800" selected>30m</option>
    <option value="3600">1h</option>
  </select>
  的归入 Others · 内圈分类 / 外圈明细 · 点扇区下钻，点中心返回
</div>
<div id="info"></div>
<div id="chart"></div>
<div id="err"></div>
</div>

<script>
  const CHROME_APPS = ["Google Chrome","Google-chrome","chrome.exe","google-chrome-stable","Chromium",
    "Chromium-browser","Chromium-browser-chromium","chromium.exe","Google-chrome-beta","Google-chrome-unstable"];
  const OTHER_COLOR = "#9ca3af";
  const SEP = " > ";
  const p = new URLSearchParams(location.search);
  // 内圈是主角：又厚又大；外圈只是一条薄薄的明细带
  const S = 460, C = S / 2, R_IN = 104, R_MID = 178, R_OUT = 206, GAP = 4;

  const fmt = (s) => {
    s = Math.round(s);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    return h ? h + "h" + String(m).padStart(2, "0") + "m" : m + "m" + String(s % 60).padStart(2, "0") + "s";
  };
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const pctNum = (v, t) => (v / t) * 100;
  const pct = (v, t) => pctNum(v, t).toFixed(1) + "%";

  async function api(path, body) {
    const r = await fetch("/api/0" + path, body ? {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    } : undefined);
    if (!r.ok) throw new Error(path + " -> " + r.status + " " + (await r.text()).slice(0, 300));
    return r.json();
  }

  let lastDraw = null, pinned = null;
  const st = { host: null, start: null, end: null, classes: [], cats: [], apps: {}, total: 0, zoom: null };

  // aw-webui 的 canonical query（window + afk + chrome + categorize）
  function queryBody(tail) {
    // query2 的字符串字面量会吃掉一层反斜杠，必须像 aw-webui 一样先还原，否则 \d \. 这类规则全失配
    const rules = JSON.stringify(
      st.classes.filter((c) => c.rule && c.rule.type === "regex").map((c) => [c.name, c.rule])
    ).replace(/\\\\/g, "\\");
    return [
      'events = flood(query_bucket(find_bucket("aw-watcher-window_' + st.host + '")));',
      'not_afk = flood(query_bucket(find_bucket("aw-watcher-afk_' + st.host + '")));',
      'not_afk = filter_keyvals(not_afk, "status", ["not-afk"]);',
      'browser_events = [];',
      'events_chrome = flood(query_bucket("aw-watcher-web-chrome_' + st.host + '"));',
      'window_chrome = filter_keyvals(events, "app", ' + JSON.stringify(CHROME_APPS) + ');',
      'events_chrome = filter_period_intersect(events_chrome, window_chrome);',
      'events_chrome = split_url_events(events_chrome);',
      'browser_events = concat(browser_events, events_chrome);',
      'audible_events = filter_keyvals(browser_events, "audible", [true]);',
      'not_afk = period_union(not_afk, audible_events);',
      'events = filter_period_intersect(events, not_afk);',
      'events = categorize(events, ' + rules + ');',
    ].concat(tail).join("\n");
  }

  function colorOf(path) {
    for (let i = path.length; i > 0; i--) {
      const key = path.slice(0, i).join(SEP);
      const hit = st.classes.find((c) => c.name.join(SEP) === key);
      if (hit && hit.data && hit.data.color) return hit.data.color;
    }
    return OTHER_COLOR;
  }

  const arc = (r0, r1, a0, a1) => {
    const pt = (r, a) => [C + r * Math.cos(a - Math.PI / 2), C + r * Math.sin(a - Math.PI / 2)];
    const big = a1 - a0 > Math.PI ? 1 : 0;
    const s1 = pt(r1, a0), s2 = pt(r1, a1), s3 = pt(r0, a1), s4 = pt(r0, a0);
    return "M" + s1[0] + " " + s1[1] + "A" + r1 + " " + r1 + " 0 " + big + " 1 " + s2[0] + " " + s2[1] +
           "L" + s3[0] + " " + s3[1] + "A" + r0 + " " + r0 + " 0 " + big + " 0 " + s4[0] + " " + s4[1] + "Z";
  };

  // 把颜色往白里兑，用来做外圈的浅色调（而不是靠透明度，透明在透明背景上会发灰）
  function tint(hex, amount) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || "");
    if (!m) return hex;
    const n = parseInt(m[1], 16);
    const mix = (c) => Math.round(c + (255 - c) * amount);
    return "rgb(" + mix((n >> 16) & 255) + "," + mix((n >> 8) & 255) + "," + mix(n & 255) + ")";
  }

  // 扇区标签：名字（放得下才画），内圈占比 >= 10% 时再带上百分比
  function label(name, dur, total, r0, r1, a0, a1, opt) {
    const size = opt.size, span = a1 - a0;
    if (span < (opt.inner ? 0.1 : 0.13)) return "";
    const mid = (a0 + a1) / 2, r = opt.inner ? r0 + (r1 - r0) * 0.52 : (r0 + r1) / 2;
    const x = C + r * Math.cos(mid - Math.PI / 2), y = C + r * Math.sin(mid - Math.PI / 2);
    let deg = (mid * 180) / Math.PI - 90;
    if (deg > 90 || deg < -90) deg += 180;
    const room = Math.floor((span * r) / (size * 0.6));
    if (room < 3) return "";
    const short = name.split(SEP).slice(-1)[0].slice(0, room);
    const share = pctNum(dur, total);
    const t = (dy, txt, fs, fill, w, op) =>
      '<text x="' + x + '" y="' + (y + dy) + '" transform="rotate(' + deg + " " + x + " " + y + ')"' +
      ' text-anchor="middle" dominant-baseline="middle" font-size="' + fs + '" font-weight="' + w +
      '" fill="' + fill + '"' + (op ? ' opacity="' + op + '"' : "") + ">" + esc(txt) + "</text>";
    if (opt.inner) {
      return share >= 10
        ? t(-8, short, size, "#fff", 600) + t(9, Math.round(share) + "%", size - 2, "#fff", 500, 0.9)
        : t(0, short, size - 1, "#fff", 600);
    }
    return t(0, short, size, "#3a3f46", 500, 0.9);
  }

  // 当前层级：默认（分类 + Others，外圈=各自明细）/ Others 展开 / 某分类的 app 明细
  function level() {
    const MIN = parseInt(document.getElementById("min").value, 10);
    const all = st.cats.map((e) => ({
      name: e.data.$category.join(SEP), path: e.data.$category,
      dur: e.duration, color: colorOf(e.data.$category), kind: "cat",
    }));

    if (st.zoom && st.zoom.kind === "cat") {
      const items = (st.apps[st.zoom.key] || []).map((a) => ({ name: a.app, dur: a.dur, color: st.zoom.color, kind: "app" }));
      return { crumb: st.zoom.name, items, total: items.reduce((s, x) => s + x.dur, 0) || st.zoom.dur, kids: null };
    }
    if (st.zoom && st.zoom.kind === "other") {
      const items = all.filter((x) => x.dur < MIN).sort((a, b) => b.dur - a.dur);
      const kids = {};
      items.forEach((it) => { kids["cat|" + it.name] = (st.apps[it.path.join(">")] || []).map(
        (a) => ({ name: a.app, dur: a.dur, color: it.color, kind: "app" })); });
      return { crumb: "Others", items, total: items.reduce((s, x) => s + x.dur, 0), kids };
    }

    const bigs = all.filter((x) => x.dur >= MIN);
    const small = all.filter((x) => x.dur < MIN).sort((a, b) => b.dur - a.dur);
    const items = small.length
      ? bigs.concat([{ name: "Others", dur: small.reduce((s, x) => s + x.dur, 0), color: OTHER_COLOR, kind: "other" }])
      : bigs;
    const kids = {};
    bigs.forEach((it) => {
      kids["cat|" + it.name] = (st.apps[it.path.join(">")] || []).map(
        (a) => ({ name: a.app, dur: a.dur, color: it.color, kind: "app" }));
    });
    kids["other|Others"] = small;  // Others 外圈展开的是它包含的分类
    return { crumb: null, items, total: st.total, kids };
  }

  function setInfo(item, total, crumb) {
    const el = document.getElementById("info");
    if (!item) {
      el.innerHTML = crumb
        ? '<div class="crumb">点中心返回上一层</div><div class="name">' + esc(crumb) + '</div><div class="val">' + fmt(total) + "</div>"
        : '<div class="crumb">&nbsp;</div><div class="name">全部</div><div class="val">' + fmt(total) + " · 悬停看明细，点击下钻</div>";
      return;
    }
    const parts = item.name.split(SEP);
    el.innerHTML = '<div class="crumb">' + (parts.length > 1 ? esc(parts.slice(0, -1).join(SEP)) : "&nbsp;") + "</div>" +
      '<div class="name">' + esc(parts.slice(-1)[0]) + "</div>" +
      '<div class="val">' + fmt(item.dur) + " · " + pct(item.dur, total) + "</div>";
  }

  function highlight(key) {
    document.querySelectorAll("#chart path").forEach((el) => {
      el.classList.toggle("dim", key !== null && el.dataset.key !== key);
    });
  }

  function draw() {
    const lv = level();
    const items = lv.items, total = lv.total, kids = lv.kids;
    const reg = {};
    let a = 0, svg = "";

    for (const it of items) {
      const a1 = a + (it.dur / total) * 2 * Math.PI;
      const key = it.kind + "|" + it.name;
      reg[key] = it;
      svg += '<path d="' + arc(R_IN, R_MID, a, a1) + '" fill="' + it.color +
             '" stroke="#fff" stroke-width="2" data-key="' + esc(key) + '"></path>' +
             label(it.name, it.dur, total, R_IN, R_MID, a, a1, { size: 15, inner: true });

      const children = (kids && kids[key]) || [];
      let b = a;
      children.forEach((ch, i) => {
        const b1 = b + (ch.dur / total) * 2 * Math.PI;
        const k2 = ch.kind + "|" + ch.name + "|" + key;
        reg[k2] = ch;
        svg += '<path d="' + arc(R_MID + GAP, R_OUT, b, b1) + '" fill="' + tint(ch.color, 0.45 + (i % 2) * 0.17) +
               '" stroke="#fff" stroke-width="1" data-key="' + esc(k2) + '"></path>' +
               label(ch.name, ch.dur, total, R_MID + GAP, R_OUT, b, b1, { size: 9 });
        b = b1;
      });
      a = a1;
    }

    const center = st.zoom
      ? '<circle id="back" cx="' + C + '" cy="' + C + '" r="' + (R_IN - 2) + '" fill="transparent"></circle>' +
        '<text x="' + C + '" y="' + (C - 10) + '" text-anchor="middle" font-size="13" fill="currentColor" opacity=".6">返回</text>' +
        '<text x="' + C + '" y="' + (C + 14) + '" text-anchor="middle" font-size="22" font-weight="600" fill="currentColor">' + fmt(total) + "</text>"
      : '<text x="' + C + '" y="' + (C + 2) + '" text-anchor="middle" font-size="26" font-weight="600" fill="currentColor">' + fmt(total) + "</text>" +
        '<text x="' + C + '" y="' + (C + 24) + '" text-anchor="middle" font-size="11" fill="currentColor" opacity=".55">total</text>';
    const chartEl = document.getElementById("chart");
    chartEl.innerHTML = '<svg viewBox="0 0 ' + S + " " + S + '">' + svg + center + "</svg>";
    fitChart();

    const leaveAll = () => applyPin();
    document.querySelectorAll("#chart path[data-key]").forEach((el) => {
      const key = el.dataset.key;
      el.addEventListener("mouseenter", () => { highlight(key); setInfo(reg[key] || null, total, lv.crumb); });
      el.addEventListener("click", () => { pinned = null; zoomTo(reg[key]); });
    });
    document.getElementById("chart").addEventListener("mouseleave", leaveAll);
    const back = document.getElementById("back");
    if (back) back.addEventListener("click", () => { st.zoom = null; draw(); });
    lastDraw = { reg: reg, total: total, crumb: lv.crumb };
    applyPin();
    reportHeight();
  }

  // 外部（Score 卡）钉住的高亮
  function applyPin() {
    if (!lastDraw) return;
    if (pinned && lastDraw.reg[pinned]) {
      highlight(pinned);
      setInfo(lastDraw.reg[pinned], lastDraw.total, lastDraw.crumb);
    } else {
      highlight(null);
      setInfo(null, lastDraw.total, lastDraw.crumb);
    }
  }

  function zoomTo(it) {
    if (!it || it.kind === "app") return;
    if (it.kind === "other") { st.zoom = { kind: "other" }; draw(); return; }
    st.zoom = { kind: "cat", key: it.path.join(">"), name: it.name, color: it.color, dur: it.dur };
    draw();
  }

  let lastReported = 0;

  // 父窗口是不是在按我们汇报的高度走？是 => 永远不要进「小框模式」，
  // 否则一次偏小的测量会把自己锁死在小尺寸（汇报小 → iframe 变矮 → 更小 → …）
  const parentHonorsHeight = () =>
    lastReported > 0 && Math.abs(window.innerHeight - lastReported) < 80;

  // 正常情况尺寸由 CSS 决定（width:100% / max-width:460），第一帧就是终值；
  // 只有真·死高度的小框（老界面 custom_vis 的 300x150 iframe）才手动按高度压
  function fitChart() {
    const chartEl = document.getElementById("chart");
    const el = chartEl.querySelector("svg");
    if (!el) return;
    if (!(window.innerHeight <= 340 && !parentHonorsHeight())) {
      el.style.width = "";
      el.style.height = "";
      return;
    }
    const size = Math.max(120, Math.min(460, chartEl.clientWidth || 460, window.innerHeight - 4));
    el.style.width = size + "px";
    el.style.height = size + "px";
  }

  function reportHeight() {
    try {
      const root = document.getElementById("root");
      const chartEl = document.getElementById("chart");
      const chartW = Math.min(460, chartEl.clientWidth || 460);
      // 下限：控制条 + 信息区 + 一个正方形的图。布局没稳时 root 高度会偏小，
      // 直接汇报出去会被父窗口当真，图就再也长不回来了
      const floor = document.getElementById("ctl").getBoundingClientRect().height +
                    document.getElementById("info").getBoundingClientRect().height + chartW + 14;
      const h = Math.ceil(Math.max(root.getBoundingClientRect().height + 6, floor));
      lastReported = h;
      parent.postMessage({ type: "aw-rollup-height", height: h, title: p.get("title") || "Time by Category" }, location.origin);
    } catch (e) {}
  }

  window.addEventListener("message", function (e) {
    if (e.origin !== location.origin || !e.data || e.data.type !== "aw-rollup-highlight") return;
    const name = e.data.name;
    if (!name) { pinned = null; applyPin(); return; }
    const key = "cat|" + name;
    // 当前在下钻层级里找不到，就先回到默认层再高亮
    if (lastDraw && !lastDraw.reg[key] && st.zoom) { st.zoom = null; pinned = key; draw(); return; }
    pinned = key;
    applyPin();
  });

  async function main() {
    const minEl = document.getElementById("min");
    try { minEl.value = localStorage.getItem("rollup_min") || "1800"; } catch (e) {}
    minEl.onchange = () => {
      try { localStorage.setItem("rollup_min", minEl.value); } catch (e) {}
      st.zoom = null; draw();
    };

    const info = await api("/info");
    st.host = p.get("hostname") || info.hostname;
    st.start = p.get("start"); st.end = p.get("end");
    if (!st.start || !st.end) {
      const now = new Date(), s = new Date(now);
      s.setHours(4, 0, 0, 0);
      if (now < s) s.setDate(s.getDate() - 1);
      st.start = s.toISOString(); st.end = now.toISOString();
    }
    st.classes = await api("/settings/classes");

    const res = (await api("/query/", {
      timeperiods: [st.start + "/" + st.end],
      query: [queryBody([
        'cat_events = sort_by_duration(merge_events_by_keys(events, ["$category"]));',
        'catapp_events = sort_by_duration(merge_events_by_keys(events, ["$category", "app"]));',
        'RETURN = {"cat_events": cat_events, "catapp_events": catapp_events};',
      ])],
    }))[0];

    st.cats = res.cat_events.filter((e) => e.duration > 0);
    st.total = st.cats.reduce((s, e) => s + e.duration, 0);
    st.apps = {};
    res.catapp_events.forEach((e) => {
      const k = e.data.$category.join(">");
      (st.apps[k] = st.apps[k] || []).push({ app: e.data.app || "?", dur: e.duration });
    });
    Object.values(st.apps).forEach((l) => l.sort((a, b) => b.dur - a.dur));

    if (!st.total) {
      document.getElementById("chart").innerHTML = '<span style="color:var(--muted)">这个时间段没有数据</span>';
      return;
    }
    draw();
    // 把每个分类的时长告诉父窗口，Score 卡直接拿来用，不必再查一遍
    try {
      const map = {};
      st.cats.forEach((e) => { map[e.data.$category.join(SEP)] = e.duration; });
      parent.postMessage({ type: "aw-rollup-durations", map: map }, location.origin);
    } catch (e) {}
  }

  const refit = () => { fitChart(); reportHeight(); };
  const ro = new ResizeObserver(refit);
  ro.observe(document.getElementById("root"));
  ro.observe(document.getElementById("chart"));
  window.addEventListener("resize", refit);
  // 父窗口那边调高度会让 iframe 布局晚几帧才稳定，补两次
  [80, 400, 1200].forEach((ms) => setTimeout(refit, ms));
  window.addEventListener("load", reportHeight);
  main().catch((e) => { document.getElementById("err").textContent = e.message; reportHeight(); });
</script>
